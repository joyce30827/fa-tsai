<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="記帳本">
<meta name="theme-color" content="#0f0f0f">
<title>記帳本</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#242424;--bg4:#2e2e2e;--text:#f0f0f0;--text2:#999;--text3:#555;--border:rgba(255,255,255,0.07);--green:#2ecc8e;--green-dim:rgba(46,204,142,0.12);--red:#f0614a;--red-dim:rgba(240,97,74,0.12);--accent:#f5c842;--accent-dim:rgba(245,200,66,0.12);--blue:#5ba4f5;--purple:#c875f0;--radius:16px;--radius-sm:10px;--font:'Noto Sans TC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:40px 32px;text-align:center}
.login-logo{font-size:60px;margin-bottom:18px}
.login-title{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:8px}
.login-sub{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:44px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:300px;padding:15px 24px;background:#fff;color:#1f1f1f;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;box-shadow:0 2px 20px rgba(0,0,0,0.5);transition:opacity .15s}
.google-btn:active{opacity:.85}
.app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
.scroll-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px}
::-webkit-scrollbar{width:0}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(12,12,12,0.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;color:var(--text3);transition:color .15s}
.nav-item.active{color:var(--accent)}
.nav-icon{font-size:21px;line-height:1}
.nav-label{font-size:10px;font-weight:500;letter-spacing:.3px}
.section{display:none}.section.active{display:block}
.page-header{padding:52px 20px 12px;position:sticky;top:0;background:var(--bg);z-index:10}
.page-header-row{display:flex;justify-content:space-between;align-items:center}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.5px}
.header-actions{display:flex;align-items:center;gap:10px}
.icon-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .4s}
.sync-dot.synced{background:var(--green)}.sync-dot.syncing{background:var(--accent);animation:pulse 1s infinite}.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);padding:18px 20px;margin:0 16px 12px}
.section-heading{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:8px 20px 6px;margin-top:4px}
/* Net worth */
.net-worth-card{background:linear-gradient(135deg,#1c1c14 0%,#141410 100%);border-radius:var(--radius);border:1px solid rgba(245,200,66,0.15);padding:22px 20px;margin:12px 16px}
.nw-label{font-size:11px;color:#998840;letter-spacing:.8px;text-transform:uppercase;font-weight:500;margin-bottom:6px}
.nw-amount{font-size:38px;font-weight:700;letter-spacing:-1.5px;margin-bottom:18px}
.nw-amount.positive{color:var(--green)}.nw-amount.negative{color:var(--red)}
.nw-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nw-sub{background:rgba(255,255,255,0.04);border-radius:var(--radius-sm);padding:12px 14px}
.nw-sub-label{font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:500}
.nw-sub-val{font-size:19px;font-weight:600}
/* Breakdown */
.breakdown-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.breakdown-item:last-child{border-bottom:none}
.breakdown-left{display:flex;align-items:center;gap:10px}
.breakdown-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.breakdown-name{font-size:14px}
.breakdown-type{font-size:11px;color:var(--text3);margin-top:2px}
.breakdown-val{font-size:15px;font-weight:500}
/* ── Transaction page new layout ── */
.tx-month-header{display:grid;grid-template-columns:1fr 1.5fr 1fr;background:var(--bg2);border-bottom:1px solid var(--border);padding:env(safe-area-inset-top,0) 0 0;padding-top:calc(env(safe-area-inset-top,0) + 48px)}
.tx-month-prev,.tx-month-next{padding:14px 12px 14px;cursor:pointer;opacity:.5;transition:opacity .15s}
.tx-month-prev:active,.tx-month-next:active{opacity:.8}
.tx-month-next{text-align:right}
.tx-month-side-year{font-size:10px;color:var(--text3);margin-bottom:3px}
.tx-month-side-range{font-size:12px;color:var(--text2)}
.tx-month-current{padding:14px 8px;text-align:center;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.tx-month-cur-year{font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:600}
.tx-month-cur-range{font-size:16px;font-weight:700;color:var(--text)}
.tx-summary-bar{display:grid;grid-template-columns:1fr 1px 1fr;background:var(--bg2);border-bottom:1px solid var(--border)}
.tx-sum-item{padding:18px 20px;cursor:pointer}
.tx-sum-label{font-size:12px;color:var(--text2);margin-bottom:6px}
.tx-sum-val{font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--text)}
.tx-sum-val.income{color:var(--text)}
.tx-sum-active{background:var(--bg3)}
.tx-sum-divider{background:var(--border)}
.tx-subtab-bar{display:flex;border-bottom:1px solid var(--border);background:var(--bg)}
.tx-subtab{flex:1;padding:13px;background:none;border:none;font-family:var(--font);font-size:14px;color:var(--text3);cursor:pointer;position:relative;font-weight:500;transition:color .15s}
.tx-subtab.active{color:var(--text);font-weight:700}
.tx-subtab.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--accent);border-radius:1px}
/* Timeline rows for tx list */
.tl-group{display:flex;padding:0 16px;border-bottom:1px solid var(--border)}
.tl-group:last-child{border-bottom:none}
.tl-date-col{width:36px;padding-top:16px;flex-shrink:0;text-align:center}
.tl-date-m{font-size:10px;color:var(--text3);font-weight:500;line-height:1.4}
.tl-date-d{font-size:20px;font-weight:700;color:var(--text2);line-height:1.1}
.tl-rows{flex:1;border-left:1px solid var(--border);margin-left:10px;padding-left:14px}
.tl-row{display:flex;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--border);gap:10px;cursor:default}
.tl-rows .tl-row:last-child{border-bottom:none}
.tl-info{flex:1;min-width:0}
.tl-cat{font-size:12px;font-weight:600;margin-bottom:3px}
.tl-cat.income{color:var(--green)}.tl-cat.expense{color:var(--accent)}.tl-cat.neutral{color:var(--text3)}
.tl-desc{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.tl-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tl-acc-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;color:#fff}
.tl-tag-badge{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
.tl-amount{font-size:15px;font-weight:700;text-align:right;flex-shrink:0;padding-top:2px}
.tl-amount.income{color:var(--green)}.tl-amount.expense{color:var(--text)}.tl-amount.neutral{color:var(--text2)}
.tl-del{background:none;border:none;color:var(--text3);font-size:15px;padding:2px 6px;cursor:pointer;margin-left:2px;flex-shrink:0;align-self:center}
/* Cat view */
.cat-row{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;border-bottom:1px solid var(--border)}
.cat-row:last-child{border-bottom:none}
.cat-row-left{display:flex;align-items:center;gap:12px}
.cat-row-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--bg3)}
.cat-row-name{font-size:14px;font-weight:500}
.cat-row-count{font-size:11px;color:var(--text3);margin-top:2px}
.cat-row-amt{font-size:15px;font-weight:700}
.cat-bar-wrap{height:3px;background:var(--bg3);border-radius:2px;margin:8px 20px 4px}
.cat-bar{height:3px;border-radius:2px;background:var(--accent);transition:width .4s}
/* Charts */
.chart-wrap{height:200px;position:relative;margin:4px 0}
/* Accounts */
.group-label{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:12px 20px 6px}
.acc-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);padding:16px 18px;margin:0 16px 10px;cursor:pointer;transition:border-color .15s}
.acc-card:active{border-color:var(--accent)}
.acc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.acc-name{font-size:16px;font-weight:600}
.acc-badge{font-size:10px;font-weight:500;padding:3px 8px;border-radius:999px;background:var(--bg3);border:1px solid var(--border)}
.acc-balance{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.acc-updated{font-size:11px;color:var(--text3)}
/* Detail screen */
.detail-screen{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:var(--bg);z-index:150;display:none;flex-direction:column;overflow:hidden}
.detail-screen.open{display:flex;position:fixed;top:0;left:0;width:100%;height:100%;}
.detail-hero{background:linear-gradient(160deg,#c0392b 0%,#96281b 100%);padding:48px 20px 28px;flex-shrink:0;position:relative}
.detail-hero-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.back-btn{background:rgba(255,255,255,0.18);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:#fff;flex-shrink:0}
.detail-hero-name{font-size:17px;font-weight:700;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-hero-sub{font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:18px;padding-left:48px}
.detail-hero-bal-label{font-size:11px;color:rgba(255,255,255,0.6);letter-spacing:.6px;text-align:right;margin-bottom:4px}
.detail-hero-bal{font-size:36px;font-weight:700;color:#fff;text-align:right;letter-spacing:-1px}
.detail-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
/* Timeline tx list */
.dtx-group{display:flex;padding:0 16px;border-bottom:1px solid var(--border)}
.dtx-group:last-child{border-bottom:none}
.dtx-date-col{width:38px;padding-top:16px;flex-shrink:0;text-align:center}
.dtx-date-month{font-size:10px;color:var(--text3);font-weight:500}
.dtx-date-day{font-size:18px;font-weight:700;color:var(--text2);line-height:1.1}
.dtx-rows{flex:1;border-left:1px solid var(--border);margin-left:10px;padding-left:14px}
.dtx-row{display:flex;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border);gap:10px}
.dtx-rows .dtx-row:last-child{border-bottom:none}
.dtx-row-info{flex:1;min-width:0}
.dtx-cat{font-size:12px;font-weight:600;margin-bottom:3px}
.dtx-cat.income{color:var(--green)}
.dtx-cat.expense{color:var(--accent)}
.dtx-cat.neutral{color:var(--text3)}
.dtx-desc{font-size:13px;color:var(--text);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.dtx-tag-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dtx-acc-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;background:#c0392b;color:#fff}
.dtx-note{font-size:11px;color:var(--text3)}
.dtx-amount{font-size:15px;font-weight:700;text-align:right;flex-shrink:0;margin-top:2px}
.dtx-amount.income{color:var(--green)}
.dtx-amount.expense{color:var(--text)}
.dtx-amount.neutral{color:var(--text2)}
/* Transactions */
.month-nav{display:flex;align-items:center;gap:10px}
.month-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.month-label{font-size:14px;font-weight:500;min-width:68px;text-align:center}
.tx-summary-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:4px}
.tx-strip-item{background:var(--bg2);border-radius:var(--radius-sm);border:1px solid var(--border);padding:12px 14px}
.tx-strip-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.tx-strip-val{font-size:18px;font-weight:600}
.filter-bar{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:5px 13px;border-radius:999px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s;flex-shrink:0}
.chip.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.tx-group-date{font-size:12px;color:var(--text3);padding:10px 20px 6px;font-weight:500}
.tx-item{background:var(--bg2);border-radius:var(--radius-sm);padding:13px 14px;margin:0 16px 8px;display:flex;align-items:center;gap:12px;border:1px solid var(--border)}
.tx-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-cat{font-size:14px;font-weight:500}
.tx-meta{font-size:11px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-right{text-align:right;flex-shrink:0}
.tx-amount{font-size:15px;font-weight:600}
.tx-amount.income{color:var(--green)}.tx-amount.expense{color:var(--red)}
.tx-date-small{font-size:10px;color:var(--text3);margin-top:2px}
.tx-del{background:none;border:none;color:var(--text3);font-size:16px;padding:4px 6px;cursor:pointer;margin-left:2px}
/* FAB */
.fab{position:fixed;bottom:84px;right:50%;transform:translateX(calc(50% + 160px));width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;color:#000;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(245,200,66,0.35);z-index:50;transition:transform .15s}
.fab:active{transform:translateX(calc(50% + 160px)) scale(0.93)}
/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:22px 22px 0 0;padding:22px 18px 32px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:34px;height:4px;background:var(--bg4);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:17px;font-weight:700;margin-bottom:18px;text-align:center}
.type-toggle{display:flex;background:var(--bg3);border-radius:var(--radius-sm);padding:4px;margin-bottom:18px}
.type-btn{flex:1;padding:9px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:none;color:var(--text2);font-family:var(--font);transition:all .15s}
.type-btn.active.income{background:var(--green-dim);color:var(--green)}
.type-btn.active.expense{background:var(--red-dim);color:var(--red)}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block;font-weight:500}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:15px;font-family:var(--font);padding:11px 13px;outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--accent)}
.amount-input{font-size:26px;font-weight:700;text-align:center;letter-spacing:-1px}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.submit-btn{width:100%;padding:15px;background:var(--accent);color:#000;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;margin-top:6px;transition:opacity .15s}
.submit-btn:active{opacity:.85}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cat-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 4px;cursor:pointer;color:var(--text);font-family:var(--font);font-size:10px;text-align:center;transition:all .15s}
.cat-btn span{display:block;font-size:19px;margin-bottom:3px}
.cat-btn.selected{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
/* Settings */
.settings-section{padding:0 16px;margin-bottom:8px}
.settings-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.settings-row:last-child{border-bottom:none}
.settings-row-left{display:flex;align-items:center;gap:12px}
.settings-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.settings-row-title{font-size:14px;font-weight:500}
.settings-row-sub{font-size:12px;color:var(--text2);margin-top:2px}
.settings-chevron{color:var(--text3);font-size:16px}
.tag-list{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.tag-item{display:flex;align-items:center;gap:6px;padding:5px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:999px;font-size:12px}
.tag-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0;line-height:1}
.add-tag-row{display:flex;gap:8px;padding:0 16px 14px}
.add-tag-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;font-family:var(--font);padding:9px 12px;outline:none}
.add-tag-input:focus{border-color:var(--accent)}
.add-tag-btn{background:var(--accent);color:#000;border:none;border-radius:var(--radius-sm);padding:9px 16px;font-weight:600;cursor:pointer;font-family:var(--font);font-size:13px}
.cat-manage-item{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--border)}
.cat-manage-item:last-child{border-bottom:none}
.cat-manage-left{display:flex;align-items:center;gap:10px}
.cat-manage-icon{font-size:20px}
.cat-manage-name{font-size:14px}
.cat-manage-del{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:4px}
/* User modal */
.user-modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;display:none;align-items:flex-end;justify-content:center}
.user-modal.open{display:flex}
.user-modal-inner{background:var(--bg2);border-radius:22px 22px 0 0;padding:22px 18px 32px;width:100%;max-width:480px;animation:slideUp .22s ease}
.user-info-row{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.user-modal-name{font-size:15px;font-weight:600}
.user-modal-email{font-size:12px;color:var(--text2);margin-top:2px}
.logout-btn{width:100%;padding:13px;background:var(--red-dim);color:var(--red);border:1px solid var(--red);border-radius:var(--radius-sm);font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer}
.cancel-btn{width:100%;padding:13px;background:none;color:var(--text2);border:none;font-size:14px;font-family:var(--font);cursor:pointer;margin-top:8px}
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--bg3);color:var(--text);font-size:12px;padding:7px 16px;border-radius:999px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid var(--border);white-space:nowrap}
.toast.show{opacity:1}
.breakdown-group-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;padding:10px 0 4px}
.breakdown-group-label:first-child{padding-top:2px}
.breakdown-subtotal{display:flex;justify-content:space-between;align-items:center;padding:10px 0 2px;border-top:1px solid var(--border);margin-top:4px;font-size:13px;font-weight:600;color:var(--text2)}
.empty-state{text-align:center;color:var(--text3);font-size:13px;padding:36px 20px}
.empty-icon{font-size:36px;margin-bottom:10px}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-logo">💰</div>
  <div class="login-title">記帳本</div>
  <div class="login-sub">登入後，所有裝置都能<br>看到同一份記帳資料</div>
  <button class="google-btn" onclick="signInWithGoogle()">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    使用 Google 帳號登入
  </button>
</div>

<div class="app" id="mainApp" style="display:none">
  <div class="scroll-body" id="scrollBody">

    <!-- TAB 1: 總覽 -->
    <div id="sec-overview" class="section active">
      <div class="page-header">
        <div class="page-header-row">
          <div class="page-title">總覽</div>
          <div class="header-actions">
            <div class="sync-dot" id="syncDot"></div>
            <button class="icon-btn" id="avatarBtn" onclick="openUserModal()">👤</button>
          </div>
        </div>
      </div>
      <div class="net-worth-card">
        <div class="nw-label">淨資產</div>
        <div class="nw-amount" id="netWorthAmount">NT$ 0</div>
        <div class="nw-row">
          <div class="nw-sub"><div class="nw-sub-label">💚 總資產</div><div class="nw-sub-val" style="color:var(--green)" id="totalAssets">NT$ 0</div></div>
          <div class="nw-sub"><div class="nw-sub-label">🔴 總負債</div><div class="nw-sub-val" style="color:var(--red)" id="totalDebts">NT$ 0</div></div>
        </div>
      </div>
      <div class="section-heading">資產明細</div>
      <div class="card" id="assetBreakdown"></div>
      <div class="section-heading">負債明細</div>
      <div class="card" id="debtBreakdown"></div>
      <div class="section-heading">近六個月收支</div>
      <div class="card"><div class="chart-wrap"><canvas id="monthChart"></canvas></div></div>
      <div class="section-heading">本月支出分類</div>
      <div class="card"><div class="chart-wrap-sm"><canvas id="catChart"></canvas></div></div>
    </div>

    <!-- TAB 2: 帳戶 -->
    <div id="sec-accounts" class="section">
      <div class="page-header">
        <div class="page-header-row">
          <div class="page-title">帳戶</div>
          <div class="header-actions">
            <button class="icon-btn" onclick="openAccModal()">＋</button>
          </div>
        </div>
      </div>
      <div id="accGroupAssets"></div>
      <div id="accGroupDebts"></div>
    </div>

    <!-- TAB 3: 明細 -->
    <div id="sec-transactions" class="section">
      <!-- Month selector header -->
      <div class="tx-month-header">
        <div class="tx-month-prev" id="txMonthPrev" onclick="changeMonth(-1)">
          <div class="tx-month-side-year" id="txPrevYear"></div>
          <div class="tx-month-side-range" id="txPrevRange"></div>
        </div>
        <div class="tx-month-current">
          <div class="tx-month-cur-year" id="txCurYear"></div>
          <div class="tx-month-cur-range" id="txCurRange"></div>
        </div>
        <div class="tx-month-next" id="txMonthNext" onclick="changeMonth(1)">
          <div class="tx-month-side-year" id="txNextYear"></div>
          <div class="tx-month-side-range" id="txNextRange"></div>
        </div>
      </div>
      <!-- Income / Expense summary -->
      <div class="tx-summary-bar">
        <div class="tx-sum-item" id="txSumIncome">
          <div class="tx-sum-label">收入</div>
          <div class="tx-sum-val income" id="txIncome">$ 0</div>
        </div>
        <div class="tx-sum-divider"></div>
        <div class="tx-sum-item tx-sum-active" id="txSumExpense">
          <div class="tx-sum-label">支出</div>
          <div class="tx-sum-val" id="txExpense">$ 0</div>
        </div>
      </div>
      <!-- Sub tabs: 分類 / 明細 -->
      <div class="tx-subtab-bar">
        <button class="tx-subtab" id="subtabCat" onclick="switchTxSubtab('cat')">分類</button>
        <button class="tx-subtab active" id="subtabDetail" onclick="switchTxSubtab('detail')">明細</button>
      </div>
      <!-- 分類 view -->
      <div id="txCatView" style="display:none;padding:8px 0 80px"></div>
      <!-- 明細 view -->
      <div id="txListContainer" style="padding-bottom:80px"></div>
    </div>

    <!-- TAB 4: 設定 -->
    <div id="sec-settings" class="section">
      <div class="page-header">
        <div class="page-header-row"><div class="page-title">設定</div></div>
      </div>
      <div class="section-heading">分類管理</div>
      <div class="settings-section">
        <div class="settings-card">

            <div class="settings-row-left">
              <div class="settings-icon" style="background:var(--red-dim)">🏷️</div>
              <div><div class="settings-row-title">支出分類</div><div class="settings-row-sub" id="expCatCount"></div></div>
            </div>
            <div class="settings-chevron">›</div>
          </div>
          <div class="settings-row" onclick="openCatModal('income')">
            <div class="settings-row-left">
              <div class="settings-icon" style="background:var(--green-dim)">🏷️</div>
              <div><div class="settings-row-title">收入分類</div><div class="settings-row-sub" id="incCatCount"></div></div>
            </div>
            <div class="settings-chevron">›</div>
          </div>
        </div>
      </div>
      <div class="section-heading">標籤管理</div>
      <div class="settings-section">
        <div class="settings-card">
          <div class="tag-list" id="tagList"></div>
          <div class="add-tag-row">
            <input class="add-tag-input" id="newTagInput" placeholder="新增標籤..." maxlength="12">
            <button class="add-tag-btn" onclick="addTag()">新增</button>
          </div>
        </div>
      </div>
      <div class="section-heading">帳號</div>
      <div class="settings-section">
        <div class="settings-card">
          <div class="settings-row" onclick="openUserModal()">
            <div class="settings-row-left">
              <div class="settings-icon" style="background:var(--accent-dim)">👤</div>
              <div><div class="settings-row-title" id="settingsUserName">未登入</div><div class="settings-row-sub" id="settingsUserEmail"></div></div>
            </div>
            <div class="settings-chevron">›</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="fab" onclick="openTxModal()">＋</button>
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('overview',0)"><span class="nav-icon">📊</span><span class="nav-label">總覽</span></button>
    <button class="nav-item" onclick="switchTab('accounts',1)"><span class="nav-icon">🏦</span><span class="nav-label">帳戶</span></button>
    <button class="nav-item" onclick="switchTab('transactions',2)"><span class="nav-icon">📋</span><span class="nav-label">明細</span></button>
    <button class="nav-item" onclick="switchTab('settings',3)"><span class="nav-icon">⚙️</span><span class="nav-label">設定</span></button>
  </nav>
</div>

<!-- Account Detail -->
<div class="detail-screen" id="detailScreen">
  <div class="detail-hero" id="detailHero">
    <div class="detail-hero-top">
      <button class="back-btn" onclick="closeDetail()">‹</button>
      <div class="detail-hero-name" id="detailTitle"></div>
    </div>
    <div class="detail-hero-sub" id="detailSub"></div>
    <div class="detail-hero-bal-label">存款餘額</div>
    <div class="detail-hero-bal" id="detailBal">NT$ 0</div>
  </div>
  <div class="detail-body">
    <div id="detailTxList"></div>
  </div>
</div>

<!-- Transaction Modal -->
<div class="modal-overlay" id="txModal" onclick="closeTxModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">新增交易</div>
    <div class="type-toggle">
      <button class="type-btn active expense" id="typeExpense" onclick="setType('expense')">支出</button>
      <button class="type-btn income" id="typeIncome" onclick="setType('income')">收入</button>
    </div>
    <div class="form-group"><label class="form-label">金額 (NT$)</label><input class="form-input amount-input" type="number" id="txAmt" placeholder="0" inputmode="decimal"></div>
    <div class="form-group"><label class="form-label">類別</label><div class="cat-grid" id="catGrid"></div></div>
    <div class="form-row2">
      <div class="form-group"><label class="form-label">帳戶</label><select class="form-input" id="txAccSel"></select></div>
      <div class="form-group"><label class="form-label">日期</label><input class="form-input" type="date" id="txDate"></div>
    </div>
    <div class="form-group"><label class="form-label">標籤（選填）</label><select class="form-input" id="txTagSel"><option value="">無標籤</option></select></div>
    <div class="form-group"><label class="form-label">備註（選填）</label><input class="form-input" type="text" id="txNote" placeholder="例：午餐、加油"></div>
    <button class="submit-btn" onclick="addTransaction()">記帳</button>
  </div>
</div>

<!-- Account Modal -->
<div class="modal-overlay" id="accModal" onclick="closeAccModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">新增帳戶</div>
    <div class="form-group"><label class="form-label">帳戶名稱</label><input class="form-input" id="accName" placeholder="e.g. 玉山活存"></div>
    <div class="form-group">
      <label class="form-label">帳戶類型</label>
      <select class="form-input" id="accKind" onchange="updateAccGroup()">
        <option value="asset_bank">台幣活存</option>
        <option value="asset_foreign">外幣存款</option>
        <option value="asset_epay">電子票證</option>
        <option value="debt_cc">信用卡</option>
        <option value="debt_loan">貸款</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label" id="accBalLabel">初始餘額 (NT$)</label><input class="form-input" type="number" id="accBal" placeholder="0"></div>
    <button class="submit-btn" onclick="addAccount()">新增帳戶</button>
  </div>
</div>

<!-- Category Modal -->
<div class="modal-overlay" id="catModal" onclick="closeCatModal(event)">
  <div class="modal" onclick="event.stopPropagation()" style="max-height:85vh">
    <div class="modal-handle"></div>
    <div class="modal-title" id="catModalTitle">分類管理</div>
    <div id="catManageList"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <input class="form-input" id="newCatIcon" placeholder="🍜" style="width:56px;text-align:center;font-size:18px;padding:8px">
      <input class="form-input" id="newCatName" placeholder="分類名稱" style="flex:1">
      <button class="add-tag-btn" onclick="addCat()">新增</button>
    </div>
  </div>
</div>

<!-- User Modal -->
<div class="user-modal" id="userModal" onclick="closeUserModal(event)">
  <div class="user-modal-inner" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="user-info-row">
      <img id="modalAvatar" src="" alt="" style="width:46px;height:46px;border-radius:50%;object-fit:cover">
      <div><div class="user-modal-name" id="modalName"></div><div class="user-modal-email" id="modalEmail"></div></div>
    </div>
    <button class="logout-btn" onclick="doSignOut()">登出</button>
    <button class="cancel-btn" onclick="closeUserModal()">取消</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut as fbSignOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey:"AIzaSyA60gtz4Elg7XF9drhdOYyfjduDFShZSB8",
  authDomain:"fa-tsai.firebaseapp.com",
  projectId:"fa-tsai",
  storageBucket:"fa-tsai.firebasestorage.app",
  messagingSenderId:"920733762276",
  appId:"1:920733762276:web:b2ada6fd39249c5b7322f1"
};
const fbApp=initializeApp(firebaseConfig);
const db=getFirestore(fbApp);
const auth=getAuth(fbApp);
const provider=new GoogleAuthProvider();

const ACC_KIND_META={
  asset_bank:{label:'台幣活存',group:'asset',color:'#2ecc8e'},
  asset_foreign:{label:'外幣存款',group:'asset',color:'#5ba4f5'},
  asset_epay:{label:'電子票證',group:'asset',color:'#f5c842'},
  debt_cc:{label:'信用卡',group:'debt',color:'#f0614a'},
  debt_loan:{label:'貸款',group:'debt',color:'#c875f0'},
};
const COLORS=['#2ecc8e','#f5c842','#f0614a','#5ba4f5','#c875f0','#ff8c42','#4ecdc4','#a8e063','#ff6b9d'];
const DEF_EXP=[{name:'餐飲',icon:'🍜'},{name:'交通',icon:'🚌'},{name:'購物',icon:'🛍'},{name:'娛樂',icon:'🎮'},{name:'醫療',icon:'💊'},{name:'教育',icon:'📚'},{name:'居家',icon:'🏠'},{name:'訂閱',icon:'📱'},{name:'其他',icon:'📦'}];
const DEF_INC=[{name:'薪資',icon:'💼'},{name:'獎金',icon:'🎉'},{name:'投資',icon:'📈'},{name:'兼職',icon:'💻'},{name:'其他',icon:'💰'}];

let state={transactions:[],accounts:[],tags:['日常','工作','旅遊','家庭'],expCats:JSON.parse(JSON.stringify(DEF_EXP)),incCats:JSON.parse(JSON.stringify(DEF_INC)),currentMonth:new Date().toISOString().slice(0,7)};
let userId=null,saveTimeout=null,unsubscribe=null;
let curType='expense',selCat='',activeFilter='all',catModalType='expense',detailAccId=null;
let barChart=null,doughChart=null;

window.signInWithGoogle=async()=>{try{await signInWithPopup(auth,provider);}catch(e){showToast('登入失敗');}};
window.doSignOut=async()=>{if(unsubscribe)unsubscribe();await fbSignOut(auth);closeUserModal();document.getElementById('mainApp').style.display='none';document.getElementById('loginScreen').style.display='flex';userId=null;};

onAuthStateChanged(auth,async user=>{
  if(user){
    userId=user.uid;
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('mainApp').style.display='flex';
    if(user.photoURL){document.getElementById('avatarBtn').innerHTML=`<img src="${user.photoURL}" style="width:34px;height:34px;border-radius:50%;object-fit:cover">`;document.getElementById('modalAvatar').src=user.photoURL;}
    document.getElementById('modalName').textContent=user.displayName||'使用者';
    document.getElementById('modalEmail').textContent=user.email||'';
    document.getElementById('settingsUserName').textContent=user.displayName||'使用者';
    document.getElementById('settingsUserEmail').textContent=user.email||'';
    setSyncDot('syncing');
    try{const snap=await getDoc(doc(db,'users',userId,'data','main'));if(snap.exists()){const d=snap.data();state.transactions=d.transactions||[];state.accounts=d.accounts||[];state.tags=d.tags||state.tags;state.expCats=d.expCats||state.expCats;state.incCats=d.incCats||state.incCats;}}catch(e){setSyncDot('error');}
    renderAll();setSyncDot('synced');setupSync();
  }
});
function setSyncDot(s){document.getElementById('syncDot').className='sync-dot '+s;}
async function saveToFirebase(){if(!userId)return;setSyncDot('syncing');try{await setDoc(doc(db,'users',userId,'data','main'),{transactions:state.transactions,accounts:state.accounts,tags:state.tags,expCats:state.expCats,incCats:state.incCats,updatedAt:Date.now()});setSyncDot('synced');}catch(e){setSyncDot('error');showToast('同步失敗');}}
function scheduleSave(){clearTimeout(saveTimeout);saveTimeout=setTimeout(saveToFirebase,600);}
function setupSync(){if(unsubscribe)unsubscribe();unsubscribe=onSnapshot(doc(db,'users',userId,'data','main'),snap=>{if(!snap.exists())return;const d=snap.data();if(d.updatedAt>(state._localUpdateAt||0)){state.transactions=d.transactions||[];state.accounts=d.accounts||[];state.tags=d.tags||state.tags;state.expCats=d.expCats||state.expCats;state.incCats=d.incCats||state.incCats;renderAll();setSyncDot('synced');}},()=>setSyncDot('error'));}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function monthTx(m){return state.transactions.filter(t=>t.date.startsWith(m||state.currentMonth));}
function accById(id){return state.accounts.find(a=>a.id===id);}
function catIcon(name,type){const l=type==='income'?state.incCats:state.expCats;return(l.find(c=>c.name===name)||{icon:'📦'}).icon;}

function renderAll(){updateMonthLabel();renderOverview();renderAccounts();renderTransactions();renderSettings();}

// Overview
function renderOverview(){
  const assets=state.accounts.filter(a=>ACC_KIND_META[a.kind]?.group==='asset');
  const debts=state.accounts.filter(a=>ACC_KIND_META[a.kind]?.group==='debt');
  const totalA=assets.reduce((s,a)=>s+a.balance,0);
  const totalD=debts.reduce((s,a)=>s+Math.abs(a.balance),0);
  const net=totalA-totalD;
  const el=document.getElementById('netWorthAmount');
  el.textContent=(net<0?'- ':'')+'NT$ '+Math.abs(net).toLocaleString();
  el.className='nw-amount '+(net>0?'positive':net<0?'negative':'');
  document.getElementById('totalAssets').textContent='NT$ '+totalA.toLocaleString();
  document.getElementById('totalDebts').textContent='NT$ '+totalD.toLocaleString();

  // Asset breakdown grouped by sub-type
  const ab=document.getElementById('assetBreakdown');
  if(!assets.length){ab.innerHTML='<div class="empty-state"><div class="empty-icon">🏦</div>尚未新增資產帳戶</div>';}
  else{
    const assetGroups=[
      {kinds:['asset_bank','asset_foreign'],label:'台幣活存 / 外幣存款'},
      {kinds:['asset_epay'],label:'電子票證'},
    ];
    let html='';
    assetGroups.forEach(g=>{
      const items=assets.filter(a=>g.kinds.includes(a.kind));
      if(!items.length)return;
      html+=`<div class="breakdown-group-label">${g.label}</div>`;
      html+=items.map(a=>`<div class="breakdown-item"><div class="breakdown-left"><div class="breakdown-dot" style="background:${ACC_KIND_META[a.kind]?.color||'#888'}"></div><div><div class="breakdown-name">${a.name}</div></div></div><div class="breakdown-val" style="color:var(--green)">NT$ ${a.balance.toLocaleString()}</div></div>`).join('');
    });
    // subtotal row
    html+=`<div class="breakdown-subtotal"><span>合計</span><span style="color:var(--green)">NT$ ${totalA.toLocaleString()}</span></div>`;
    ab.innerHTML=html;
  }

  // Debt breakdown grouped by sub-type
  const db2=document.getElementById('debtBreakdown');
  if(!debts.length){db2.innerHTML='<div class="empty-state"><div class="empty-icon">💳</div>尚未新增負債帳戶</div>';}
  else{
    const debtGroups=[
      {kinds:['debt_cc'],label:'信用卡'},
      {kinds:['debt_loan'],label:'貸款'},
    ];
    let html='';
    debtGroups.forEach(g=>{
      const items=debts.filter(a=>g.kinds.includes(a.kind));
      if(!items.length)return;
      html+=`<div class="breakdown-group-label">${g.label}</div>`;
      html+=items.map(a=>`<div class="breakdown-item"><div class="breakdown-left"><div class="breakdown-dot" style="background:${ACC_KIND_META[a.kind]?.color||'#888'}"></div><div><div class="breakdown-name">${a.name}</div></div></div><div class="breakdown-val" style="color:var(--red)">NT$ ${Math.abs(a.balance).toLocaleString()}</div></div>`).join('');
    });
    html+=`<div class="breakdown-subtotal"><span>合計</span><span style="color:var(--red)">NT$ ${totalD.toLocaleString()}</span></div>`;
    db2.innerHTML=html;
  }
  renderCharts();
}
function renderCharts(){
  const [y,m]=state.currentMonth.split('-').map(Number);
  const months=[];for(let i=5;i>=0;i--){const dt=new Date(y,m-1-i,1);months.push(dt.toISOString().slice(0,7));}
  const inc=months.map(mo=>state.transactions.filter(t=>t.type==='income'&&t.date.startsWith(mo)).reduce((s,t)=>s+t.amount,0));
  const exp=months.map(mo=>state.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(mo)).reduce((s,t)=>s+t.amount,0));
  const labels=months.map(mo=>parseInt(mo.split('-')[1])+'月');
  if(barChart)barChart.destroy();
  barChart=new Chart(document.getElementById('monthChart'),{type:'bar',data:{labels,datasets:[{label:'收入',data:inc,backgroundColor:'rgba(46,204,142,0.8)',borderRadius:5,borderSkipped:false},{label:'支出',data:exp,backgroundColor:'rgba(240,97,74,0.8)',borderRadius:5,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#666',font:{size:11},boxWidth:10}}},scales:{x:{ticks:{color:'#555'},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#555',callback:v=>`${(v/1000).toFixed(0)}K`},grid:{color:'rgba(255,255,255,0.04)'}}}}});
  const catData={};monthTx().filter(t=>t.type==='expense').forEach(t=>{catData[t.category]=(catData[t.category]||0)+t.amount;});
  if(doughChart)doughChart.destroy();
  const ck=Object.keys(catData);
  if(ck.length)doughChart=new Chart(document.getElementById('catChart'),{type:'doughnut',data:{labels:ck,datasets:[{data:ck.map(k=>catData[k]),backgroundColor:COLORS,borderWidth:0,hoverOffset:5}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right',labels:{color:'#666',font:{size:11},boxWidth:10,padding:6}}}}});
}

// Accounts
function renderAccounts(){
  function accHTML(a){const meta=ACC_KIND_META[a.kind]||{};const isDebt=meta.group==='debt';const updated=a.updatedAt?new Date(a.updatedAt).toLocaleDateString('zh-TW'):'—';return`<div class="acc-card" onclick="openDetail('${a.id}')"><div class="acc-top"><div class="acc-name">${a.name}</div><div class="acc-badge" style="border-color:${meta.color||'#555'};color:${meta.color||'#888'}">${meta.label||''}</div></div><div class="acc-balance" style="color:${isDebt?'var(--red)':'var(--green)'}">${isDebt&&a.balance!==0?'- ':''}NT$ ${Math.abs(a.balance).toLocaleString()}</div><div class="acc-updated">最後更新：${updated}</div></div>`;}

  const subGroups=[
    {kinds:['asset_bank','asset_foreign'],label:'台幣活存 / 外幣存款',emptyIcon:'🏦'},
    {kinds:['asset_epay'],label:'電子票證',emptyIcon:'🪙'},
    {kinds:['debt_cc'],label:'信用卡',emptyIcon:'💳'},
    {kinds:['debt_loan'],label:'貸款',emptyIcon:'📋'},
  ];
  let html='';
  subGroups.forEach(g=>{
    const items=state.accounts.filter(a=>g.kinds.includes(a.kind));
    if(!items.length)return;
    html+=`<div class="group-label">${g.label}</div>`+items.map(accHTML).join('');
  });
  if(!html)html='<div class="group-label">資產</div><div class="empty-state"><div class="empty-icon">🏦</div>尚未新增帳戶<br>點右上角 ＋ 新增</div>';
  document.getElementById('accGroupAssets').innerHTML=html;
  document.getElementById('accGroupDebts').innerHTML='';
}
window.openDetail=function(id){
  detailAccId=id;const a=accById(id);if(!a)return;
  const meta=ACC_KIND_META[a.kind]||{};const isDebt=meta.group==='debt';
  // Hero header
  document.getElementById('detailTitle').textContent=a.name;
  document.getElementById('detailSub').textContent=meta.label||'';
  const heroColor=meta.color||'#c0392b';
  document.getElementById('detailHero').style.background=`linear-gradient(160deg,${heroColor}cc 0%,${heroColor}99 100%)`;
  const bel=document.getElementById('detailBal');
  bel.textContent='$ '+(isDebt?'-':'')+Math.abs(a.balance).toLocaleString();
  // Timeline tx list
  const txs=state.transactions.filter(t=>t.accountId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const el=document.getElementById('detailTxList');
  if(!txs.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">📝</div>尚無交易記錄</div>';document.getElementById('detailScreen').classList.add('open');return;}
  // Group by date
  const groups={};txs.forEach(t=>{if(!groups[t.date])groups[t.date]=[];groups[t.date].push(t);});
  el.innerHTML=Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,ts])=>{
    const d=new Date(date+'T00:00:00');
    const month=(d.getMonth()+1)+'月';
    const day=d.getDate();
    const rows=ts.map(t=>{
      const sign=t.type==='income'?'+':'-';
      const amtCls=t.type==='income'?'income':t.type==='expense'?'expense':'neutral';
      const catCls=t.type==='income'?'income':t.type==='expense'?'expense':'neutral';
      const catIcon_=catIcon(t.category,t.type);
      const tagBadge=t.tag?`<span class="dtx-note">#${t.tag}</span>`:'';
      const noteTxt=t.note?`<span class="dtx-note">${t.note}</span>`:'';
      return`<div class="dtx-row">
        <div class="dtx-row-info">
          <div class="dtx-cat ${catCls}">${t.category}</div>
          <div class="dtx-desc">${t.note||t.category}</div>
          <div class="dtx-tag-row">
            <span class="dtx-acc-badge">${a.name.slice(0,4)}</span>
            ${tagBadge}
          </div>
        </div>
        <div class="dtx-amount ${amtCls}">${t.type==='income'?'$ '+t.amount.toLocaleString():'$ -'+t.amount.toLocaleString()}</div>
      </div>`;
    }).join('');
    return`<div class="dtx-group">
      <div class="dtx-date-col"><div class="dtx-date-month">${month}</div><div class="dtx-date-day">${day}</div></div>
      <div class="dtx-rows">${rows}</div>
    </div>`;
  }).join('');
  document.getElementById('detailScreen').classList.add('open');
};
window.closeDetail=()=>{document.getElementById('detailScreen').classList.remove('open');detailAccId=null;};

// Transactions
let txSubtab='detail';
window.switchTxSubtab=function(tab){
  txSubtab=tab;
  document.getElementById('subtabCat').classList.toggle('active',tab==='cat');
  document.getElementById('subtabDetail').classList.toggle('active',tab==='detail');
  document.getElementById('txCatView').style.display=tab==='cat'?'block':'none';
  document.getElementById('txListContainer').style.display=tab==='detail'?'block':'none';
  renderTransactions();
};
function monthRangeLabel(ym){
  const[y,m]=ym.split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  return`${m}/1 - ${m}/${last}`;
}
function updateMonthLabel(){
  const[y,m]=state.currentMonth.split('-').map(Number);
  const prev=new Date(y,m-2,1);const next=new Date(y,m,1);
  const prevYM=prev.toISOString().slice(0,7);
  const nextYM=next.toISOString().slice(0,7);
  document.getElementById('txPrevYear').textContent=prevYM.split('-')[0];
  document.getElementById('txPrevRange').textContent=monthRangeLabel(prevYM);
  document.getElementById('txCurYear').textContent=y;
  document.getElementById('txCurRange').textContent=`${m}/1 - ${m}/${new Date(y,m,0).getDate()}`;
  document.getElementById('txNextYear').textContent=nextYM.split('-')[0];
  document.getElementById('txNextRange').textContent=monthRangeLabel(nextYM);
  // also update old monthLabel if exists
  const ml=document.getElementById('monthLabel');if(ml)ml.textContent=`${y}/${m}`;
}
window.changeMonth=function(d){const[y,m]=state.currentMonth.split('-').map(Number);const dt=new Date(y,m-1+d,1);state.currentMonth=dt.toISOString().slice(0,7);renderTransactions();};
function tlCardHTML(t){
  const acc=accById(t.accountId);
  const amtCls=t.type==='income'?'income':t.type==='expense'?'expense':'neutral';
  const catCls=amtCls;
  const badgeColor=acc?(ACC_KIND_META[acc.kind]?.color||'#555'):'#555';
  const accBadge=acc?`<span class="tl-acc-badge" style="background:${badgeColor}">${acc.name.slice(0,4)}</span>`:'';
  const tagBadge=t.tag?`<span class="tl-tag-badge">${t.tag}</span>`:'';
  const amtStr=t.type==='income'?`$ ${t.amount.toLocaleString()}`:`$ -${t.amount.toLocaleString()}`;
  return`<div class="tl-row">
    <div class="tl-info">
      <div class="tl-cat ${catCls}">${t.category}</div>
      <div class="tl-desc">${t.note||t.category}</div>
      <div class="tl-badges">${accBadge}${tagBadge}</div>
    </div>
    <div style="display:flex;align-items:center;gap:2px">
      <div class="tl-amount ${amtCls}">${amtStr}</div>
      <button class="tl-del" onclick="deleteTx('${t.id}');event.stopPropagation()">✕</button>
    </div>
  </div>`;
}
function renderTransactions(){
  updateMonthLabel();
  const tx=monthTx();
  const inc=tx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const exp=tx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  document.getElementById('txIncome').textContent='$ '+inc.toLocaleString();
  document.getElementById('txExpense').textContent='$ '+exp.toLocaleString();

  if(txSubtab==='cat'){
    // Category breakdown view
    const expTx=tx.filter(t=>t.type==='expense');
    const totalExp=expTx.reduce((s,t)=>s+t.amount,0);
    const catMap={};
    expTx.forEach(t=>{if(!catMap[t.category])catMap[t.category]={amount:0,count:0,icon:'📦'};catMap[t.category].amount+=t.amount;catMap[t.category].count++;});
    // get icons from expCats
    state.expCats.forEach(c=>{if(catMap[c.name])catMap[c.name].icon=c.icon;});
    const sorted=Object.entries(catMap).sort((a,b)=>b[1].amount-a[1].amount);
    const el=document.getElementById('txCatView');
    if(!sorted.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div>這個月沒有支出記錄</div>';return;}
    el.innerHTML=`<div style="padding:10px 20px 6px;font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.6px;text-transform:uppercase">支出分類</div>`+sorted.map(([name,d])=>{
      const pct=totalExp?Math.round(d.amount/totalExp*100):0;
      return`<div class="cat-row">
        <div class="cat-row-left">
          <div class="cat-row-icon">${d.icon}</div>
          <div><div class="cat-row-name">${name}</div><div class="cat-row-count">${d.count} 筆 · ${pct}%</div></div>
        </div>
        <div class="cat-row-amt" style="color:var(--text)">$ ${d.amount.toLocaleString()}</div>
      </div>
      <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pct}%"></div></div>`;
    }).join('');
  } else {
    // Timeline detail view
    const sorted=tx.slice().sort((a,b)=>b.date.localeCompare(a.date));
    const el=document.getElementById('txListContainer');
    if(!sorted.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div>這個月沒有記錄</div>';return;}
    const g={};sorted.forEach(t=>{if(!g[t.date])g[t.date]=[];g[t.date].push(t);});
    el.innerHTML=Object.entries(g).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,ts])=>{
      const d=new Date(date+'T00:00:00');
      return`<div class="tl-group">
        <div class="tl-date-col"><div class="tl-date-m">${d.getMonth()+1}月</div><div class="tl-date-d">${d.getDate()}</div></div>
        <div class="tl-rows">${ts.map(t=>tlCardHTML(t)).join('')}</div>
      </div>`;
    }).join('');
  }
}

// Settings
function renderSettings(){
  document.getElementById('expCatCount').textContent=state.expCats.length+' 個分類';
  document.getElementById('incCatCount').textContent=state.incCats.length+' 個分類';
  document.getElementById('tagList').innerHTML=state.tags.map(tag=>`<div class="tag-item">${tag}<button class="tag-del" onclick="deleteTag('${tag}')">✕</button></div>`).join('');
}
window.addTag=function(){const inp=document.getElementById('newTagInput');const v=inp.value.trim();if(!v||state.tags.includes(v))return;state.tags.push(v);inp.value='';state._localUpdateAt=Date.now();scheduleSave();renderSettings();showToast('標籤已新增');};
window.deleteTag=function(tag){state.tags=state.tags.filter(t=>t!==tag);state._localUpdateAt=Date.now();scheduleSave();renderSettings();};

window.openCatModal=function(type){catModalType=type;document.getElementById('catModalTitle').textContent=type==='expense'?'支出分類管理':'收入分類管理';renderCatList();document.getElementById('catModal').classList.add('open');};
window.closeCatModal=function(e){if(!e||e.target===document.getElementById('catModal'))document.getElementById('catModal').classList.remove('open');};
function renderCatList(){const list=catModalType==='expense'?state.expCats:state.incCats;document.getElementById('catManageList').innerHTML=list.map(c=>`<div class="cat-manage-item"><div class="cat-manage-left"><span class="cat-manage-icon">${c.icon}</span><span class="cat-manage-name">${c.name}</span></div><button class="cat-manage-del" onclick="deleteCat('${c.name}')">✕</button></div>`).join('');}
window.addCat=function(){const icon=document.getElementById('newCatIcon').value.trim()||'📦';const name=document.getElementById('newCatName').value.trim();if(!name)return;const list=catModalType==='expense'?state.expCats:state.incCats;if(list.find(c=>c.name===name))return showToast('已有此分類');list.push({name,icon});document.getElementById('newCatIcon').value='';document.getElementById('newCatName').value='';state._localUpdateAt=Date.now();scheduleSave();renderCatList();renderSettings();showToast('分類已新增');};
window.deleteCat=function(name){if(catModalType==='expense')state.expCats=state.expCats.filter(c=>c.name!==name);else state.incCats=state.incCats.filter(c=>c.name!==name);state._localUpdateAt=Date.now();scheduleSave();renderCatList();renderSettings();};

// Transaction modal
window.openTxModal=function(){curType='expense';document.getElementById('typeExpense').className='type-btn active expense';document.getElementById('typeIncome').className='type-btn income';selCat=state.expCats[0]?.name||'';buildCatGrid();document.getElementById('txAccSel').innerHTML=state.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');document.getElementById('txDate').value=new Date().toISOString().slice(0,10);document.getElementById('txAmt').value='';document.getElementById('txNote').value='';document.getElementById('txTagSel').innerHTML='<option value="">無標籤</option>'+state.tags.map(t=>`<option>${t}</option>`).join('');document.getElementById('txModal').classList.add('open');setTimeout(()=>document.getElementById('txAmt').focus(),200);};
window.closeTxModal=function(e){if(!e||e.target===document.getElementById('txModal'))document.getElementById('txModal').classList.remove('open');};
window.setType=function(type){curType=type;document.getElementById('typeExpense').className='type-btn'+(type==='expense'?' active expense':'');document.getElementById('typeIncome').className='type-btn'+(type==='income'?' active income':'');selCat='';buildCatGrid();};
function buildCatGrid(){const cats=curType==='expense'?state.expCats:state.incCats;if(!selCat&&cats.length)selCat=cats[0].name;document.getElementById('catGrid').innerHTML=cats.map(c=>`<button class="cat-btn${selCat===c.name?' selected':''}" onclick="window._selCat('${c.name}')"><span>${c.icon}</span>${c.name}</button>`).join('');}
window._selCat=n=>{selCat=n;buildCatGrid();};
window.addTransaction=function(){const amt=parseFloat(document.getElementById('txAmt').value);if(!amt||amt<=0)return;const accId=document.getElementById('txAccSel').value;if(!accId)return showToast('請先新增帳戶');const t={id:Date.now()+'',type:curType,amount:amt,category:selCat,accountId:accId,date:document.getElementById('txDate').value,note:document.getElementById('txNote').value.trim(),tag:document.getElementById('txTagSel').value||''};state.transactions.push(t);const acc=accById(accId);if(acc){acc.balance+=curType==='income'?amt:-amt;acc.updatedAt=Date.now();}document.getElementById('txModal').classList.remove('open');state._localUpdateAt=Date.now();scheduleSave();renderAll();showToast('已記帳 ✓');};
window.deleteTx=function(id){const t=state.transactions.find(x=>x.id===id);if(!t)return;const acc=accById(t.accountId);if(acc){acc.balance+=t.type==='income'?-t.amount:t.amount;acc.updatedAt=Date.now();}state.transactions=state.transactions.filter(x=>x.id!==id);state._localUpdateAt=Date.now();scheduleSave();renderAll();if(detailAccId)openDetail(detailAccId);};

// Account modal
window.openAccModal=function(){document.getElementById('accName').value='';document.getElementById('accBal').value='';document.getElementById('accModal').classList.add('open');updateAccGroup();};
window.closeAccModal=function(e){if(!e||e.target===document.getElementById('accModal'))document.getElementById('accModal').classList.remove('open');};
window.updateAccGroup=function(){const kind=document.getElementById('accKind').value;document.getElementById('accBalLabel').textContent=ACC_KIND_META[kind]?.group==='debt'?'目前欠款 (NT$)':'初始餘額 (NT$)';};
window.addAccount=function(){const name=document.getElementById('accName').value.trim();if(!name)return;const kind=document.getElementById('accKind').value;const isDebt=ACC_KIND_META[kind]?.group==='debt';const raw=parseFloat(document.getElementById('accBal').value)||0;state.accounts.push({id:'a'+Date.now(),name,kind,balance:isDebt?-Math.abs(raw):raw,updatedAt:Date.now()});document.getElementById('accModal').classList.remove('open');state._localUpdateAt=Date.now();scheduleSave();renderAll();showToast('帳戶已新增');};

// User modal
window.openUserModal=()=>document.getElementById('userModal').classList.add('open');
window.closeUserModal=function(e){if(!e||e.target===document.getElementById('userModal'))document.getElementById('userModal').classList.remove('open');};

// Tab switch
window.switchTab=function(name,idx){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById('sec-'+name).classList.add('active');document.querySelectorAll('.nav-item').forEach((n,i)=>n.classList.toggle('active',i===idx));document.getElementById('scrollBody').scrollTop=0;if(name==='overview')setTimeout(()=>renderCharts(),60);};

renderAll();
</script>
